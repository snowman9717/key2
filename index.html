<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鍵盤音程練習：全音與半音</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-y: auto;
        }

        .game-card {
            width: 100%;
            max-width: 1080px;
            background: #101625;
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid #1e293b;
        }

        /* 1. 頂部標題區 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #172033;
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid #23314d;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .title-text h1 {
            font-size: 1.35rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .title-text p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-box {
            background: #0d1322;
            padding: 6px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1e293b;
            min-width: 68px;
        }

        .badge-label {
            font-size: 0.65rem;
            color: #64748b;
            font-weight: 700;
        }

        .badge-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fbbf24;
        }

        .btn-toggle {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* 2. 中間控制區 (左右分欄) */
        .middle-section {
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 16px;
            align-items: stretch;
        }

        /* 左側拉霸區 */
        .slot-container {
            background: #172033;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #23314d;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .slot-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .slot-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .slot-box {
            width: 100%;
            height: 68px;
            background: #0b0f19;
            border-radius: 10px;
            border: 2px solid #2d3d5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            font-weight: 900;
            color: #38bdf8;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.7);
        }

        /* 右側按鈕與進度區 */
        .control-panel {
            background: #172033;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #23314d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .row-top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-spin {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-demo {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .progress-label {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 700;
        }

        .pill-container {
            display: flex;
            gap: 6px;
        }

        .pill {
            min-width: 40px;
            height: 32px;
            padding: 0 8px;
            background: #0284c7;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
        }

        .pill.empty {
            background: #0d1322;
            color: #475569;
            border: 1px solid #1e293b;
            box-shadow: none;
        }

        .row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.95rem;
            font-weight: 800;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-clear {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 3. 鋼琴鍵盤區 */
        .keyboard-wrapper {
            background: #172033;
            border-radius: 16px;
            padding: 16px 12px 12px 12px;
            border: 1px solid #23314d;
            overflow-x: auto;
        }

        .keyboard {
            position: relative;
            display: flex;
            height: 200px;
            width: 100%;
            min-width: 700px;
            margin: 0 auto;
        }

        .white-key {
            flex: 1;
            background: linear-gradient(to bottom, #f8fafc 0%, #e2e8f0 100%);
            border: 1px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 8px 8px;
            position: relative;
            z-index: 1;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 12px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #1e293b;
            box-shadow: inset 0 -6px 12px rgba(0,0,0,0.08), 0 4px 6px rgba(0,0,0,0.3);
        }

        .white-key:active, .white-key.active {
            background: #cbd5e1;
            transform: translateY(2px);
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.15);
        }

        .black-key {
            position: absolute;
            width: 5.2%;
            height: 60%;
            background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
            border-radius: 0 0 6px 6px;
            z-index: 2;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            font-size: 0.7rem;
            line-height: 1.15;
            color: #38bdf8;
            font-weight: 800;
            text-align: center;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.6);
        }

        .black-key:active, .black-key.active {
            background: #1e293b;
            transform: translateY(2px);
            box-shadow: 1px 2px 4px rgba(0,0,0,0.5);
        }

        /* G5 右上角半個裝飾黑鍵 */
        .dummy-key {
            position: absolute;
            right: 0;
            top: 0;
            width: 2.6%;
            height: 60%;
            background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
            border-radius: 0 0 0 6px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.85;
        }

            font-size: 0.55em;
            vertical-align
